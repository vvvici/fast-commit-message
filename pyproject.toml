[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-commit-message"
version = "0.3.0"
description = "本地 AI 生成规范 commit message —— 单文件、零依赖、代码不出本机"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["git", "commit", "ai", "llm", "ollama", "conventional-commits", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.scripts]
fcm = "fcm:main"

[tool.setuptools]
py-modules = ["fcm"]
